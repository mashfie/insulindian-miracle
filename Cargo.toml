[package]
name = "insulindian-miracle"
version = "0.1.0"
edition = "2021"

[lib]
name = "engine"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[[bin]]
name = "insulindian-miracle"
path = "rust/src/main.rs"

[dependencies]
pyo3 = { version = "0.21.2", features = ["extension-module", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ndarray = "0.15"
rayon = "1.10.0"
rand = "0.8"
rand_distr = "0.4"
rand_pcg = "0.3"
arrow = { version = "53.0", features = ["ipc"] }
parquet = "53.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "=0.4.38"
