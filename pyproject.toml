[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "insulindian-miracle"
version = "0.1.0"
description = "Backend toolkit for peninsula terrain generation and bandit-driven city formation experiments."
readme = "peninsula-bandits-CLAUDE.md"
requires-python = ">=3.14"
dependencies = [
  "numpy>=2.0",
]

[project.scripts]
insulindian-miracle = "insulindian_miracle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
